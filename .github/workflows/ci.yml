# CI v2 (docs/build.md): сборки обеих целей без предупреждений, запреты и слои, эталонные хеши --sim,
# повтор записи Linux на настоящем Windows; окно под lavapipe со слоями проверки Vulkan.
# Долгое разнесено по машинам (у каждой 4 ядра), однопоточные проверки внутри задачи идут параллельно
# (tools/ci_par.sh), у каждой свой предел времени: зависание падает за минуты, а не по таймауту задачи
name: ci
on:
  push:
    branches: [claude/project-v2]
  pull_request:
  workflow_dispatch:

jobs:
  # Сборки, слои, сетки, хеши clang -O2 и gcc, запись для Windows. Отладочная сборка — в задаче debug
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Пакеты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build glslang-tools spirv-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev python3-numpy
      - name: Кеш компиляторов и SDL3
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/anathemyre
            build/third_party
          key: tc-${{ runner.os }}-${{ hashFiles('tools/versions.sh', 'tools/toolchain.sh', 'tools/third_party.sh') }}
      - name: Компиляторы и SDL3
        run: |
          make toolchain third_party TARGET=linux
          make toolchain third_party TARGET=windows
      - name: Одна версия clang на обеих целях
        run: |
          . tools/versions.sh
          a=$(~/.cache/anathemyre/llvm-$LLVM_VER/bin/clang --version | head -1 | grep -oE 'clang version [0-9.]+')
          b=$(~/.cache/anathemyre/llvm-mingw-$LLVM_MINGW_VER/bin/clang --version | head -1 | grep -oE 'clang version [0-9.]+')
          echo "linux: $a, windows: $b"
          [ "$a" = "$b" ]
      - name: Слои и запреты
        run: make check
      - name: Сетки в git совпадают с генератором
        run: |
          # люди: исходники MakeHuman качает tools/humanconv/fetch.sh в кеш (sha256), docs/people.md
          make -s meshes
          git diff --exit-code data/meshes data/people
      - name: Дорожки клипов в git совпадают с запеканием
        run: |
          # ретаргет (bpy, сырые BVH/FBX) в CI не гоняем: запекание читает закоммиченные .anim (docs/anim.md)
          make -s anims
          git diff --exit-code data/anims
      - name: Сборки
        run: |
          # четыре сборки разом: модулей в каждой мало, по одной ядра простаивают
          . tools/ci_par.sh
          J=$(nproc)
          par release 600 make -s -j$J WERROR=1
          par windows 600 make -s -j$J WERROR=1 TARGET=windows
          par gcc 600 make -s -j$J WERROR=1 COMPILER=gcc
          par nodebug 600 make -s -j$J WERROR=1 NODEBUG=1
          par_wait 20
      - name: Эталонные хеши --sim (clang -O2, gcc), запись для Windows
        run: |
          . tools/ci_par.sh
          par sim_clang 180 make -s sim-check
          par sim_gcc 180 make -s sim-check COMPILER=gcc
          par record 180 build/linux-release/anathemyre --sim 10000 --seed 1 --record linux.rec
          par_wait 3
      - name: Для Windows-раннера
        run: |
          mkdir -p win
          cp -r build/windows-release/anathemyre.exe build/windows-release/shaders build/windows-release/data linux.rec \
            tests/sim_hashes.txt win/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: win/
          retention-days: 7

  # Отладочная сборка (clang -O0, ASan + UBSan): эталонные хеши и повтор записи релиза — бит в бит между
  # оптимизациями. Обе проверки ~2.5 мин однопоточно, поэтому рядом друг с другом и отдельно от linux
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Пакеты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build glslang-tools spirv-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev
      - name: Кеш компиляторов и SDL3
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/anathemyre
            build/third_party
          key: tc-window-${{ runner.os }}-${{ hashFiles('tools/versions.sh', 'tools/toolchain.sh', 'tools/third_party.sh') }}
      - name: Компиляторы и SDL3
        run: make toolchain third_party TARGET=linux
      - name: Сборки отладка и релиз
        run: |
          . tools/ci_par.sh
          J=$(nproc)
          par debug 600 make -s -j$J WERROR=1 MODE=debug
          par release 600 make -s -j$J WERROR=1
          par_wait 20
      - name: Эталонные хеши --sim (clang -O0 с ASan), запись релиза и её повтор отладкой
        run: |
          . tools/ci_par.sh
          par sim_debug 420 make -s sim-check MODE=debug
          par replay 480 sh -c 'build/linux-release/anathemyre --sim 10000 --seed 1 --record linux.rec &&
            build/linux-debug/anathemyre --replay linux.rec'
          par_wait 3

  # Окно под Xvfb + lavapipe со слоями проверки Vulkan. lavapipe медленный: конвейеры создаются ~0.5 мин на
  # запуск, первый кадр (горизонт, кеш земли, зонды, JIT шейдеров) — минуты. Четыре машины: ASan, GPU-AV, снимок,
  # сверка кадров. Три запуска разом на одной машине шли втрое дольше одного: первый кадр lavapipe считает всеми ядрами
  # Кеш шейдеров Mesa (~/.cache/mesa_shader_cache) между прогонами снимает JIT неизменных шейдеров
  # (машинный код тот же, кадр побайтно тот же); конвейеры lavapipe не кеширует (docs/frame_time.md)
  window:
    name: window (${{ matrix.kind }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        kind: [asan, gpuav, shot, same]
    steps:
      - uses: actions/checkout@v4
      - name: Пакеты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build glslang-tools spirv-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev mesa-vulkan-drivers vulkan-validationlayers xvfb
      - name: Кеш компиляторов и SDL3
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/anathemyre
            build/third_party
          key: tc-window-${{ runner.os }}-${{ hashFiles('tools/versions.sh', 'tools/toolchain.sh', 'tools/third_party.sh') }}
      # Ключ со своим номером прогона, сохраняется и после падения или снятия по пределу: иначе упавшая задача кеш
      # не сохраняла, следующая снова шла с холодным (вдвое дольше) и снова падала. Берётся последний с теми же
      # шейдерами, иначе последний вообще (неизменные шейдеры в нём есть)
      - name: Кеш шейдеров Mesa
        id: mesa
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/mesa_shader_cache
          key: lvp-${{ matrix.kind }}-${{ hashFiles('data/shaders/**', 'data/materials.txt', 'tools/matgen.sh') }}-${{ github.run_id }}
          restore-keys: |
            lvp-${{ matrix.kind }}-${{ hashFiles('data/shaders/**', 'data/materials.txt', 'tools/matgen.sh') }}-
            lvp-${{ matrix.kind }}-
      - name: Компиляторы и SDL3
        run: make toolchain third_party TARGET=linux
      - name: Сборка
        run: make -s -j$(nproc) WERROR=1 MODE=${{ matrix.kind == 'asan' && 'debug' || 'release' }}
      - name: Отладка с ASan и слоями проверки
        if: matrix.kind == 'asan'
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/lsan.supp
        run: |
          . tools/ci_par.sh
          . tools/versions.sh
          export ASAN_SYMBOLIZER_PATH=~/.cache/anathemyre/llvm-$LLVM_VER/bin/llvm-symbolizer  # иначе подавления не видят имён функций
          # ASan + слои проверки: ошибки Vulkan видны с первых кадров, малое окно — lavapipe считает пиксели
          par asan 600 xvfb-run -n 91 -s "-screen 0 1600x900x24" build/linux-debug/anathemyre --frames 30 --validation \
            --window 640 360
          par_wait 40
      - name: Проверка на GPU (GPU-AV)
        if: matrix.kind == 'gpuav'
        run: |
          . tools/ci_par.sh
          # чтение и запись мимо буферов по адресам, кадр мира (docs/graph.md «Проверки»).
          # Пять шейдеров lavapipe под GPU-AV не тянет (падает, съедает ~14 ГБ или считает минуты) — без проверки;
          # лучи зондов (gi_trace) — снимок 4 × 49 152 зонда под GPU-AV идёт дольше 10 мин
          # Камера у стенда людей с согнутой костью и морфом: скиннинг и сферы кластеров тоже под проверкой
          # Свет «Средне»: шейдеры и ветки те же, что на «Высоко», меньше лишь размеры (карта облаков 1024² вместо
          # 1536², зондов за кадр 1024 вместо 1536). Первый кадр собирает всю карту облаков, под GPU-AV это была
          # половина прогона (docs/graph.md, «Проверки»). «Высоко» идёт в окнах asan, shot и same
          par gpuav 720 xvfb-run -n 92 -s "-screen 0 1600x900x24" build/linux-release/anathemyre --frames 4 --window 640 360 \
            --gpuav --gpuav-skip light_cells.comp,ground_bake.comp,cull_scan.comp,horizon.comp,gi_trace.comp \
            --cam 45 5 6 11698 -2348.5 --stand elbow,morph1 --light medium
          par_wait 5
      - name: Снимок сцены
        if: matrix.kind == 'shot'
        run: |
          . tools/ci_par.sh
          # снимок в полный размер для глаза
          par shot 360 xvfb-run -n 93 -s "-screen 0 1600x900x24" build/linux-release/anathemyre --frames 10 --validation \
            --shot frame.bmp
          par_wait 2
      - uses: actions/upload-artifact@v4
        if: matrix.kind == 'shot'
        with:
          name: frame
          path: frame.bmp
          retention-days: 7
      - name: Сверка кадров и счётчики работы
        if: matrix.kind == 'same'
        run: |
          . tools/ci_par.sh
          # кадр мира одинаков от запуска к запуску (docs/frame.md, «Сверка кадров»): два запуска с тестовыми огнями
          # и картой огней по клеткам, побайтно. Без интерфейса (к/с в нём разные) и --timelapse: кадр — ровно один
          # шаг мира, а не сколько успело по часам. Оба запуска разом на одной машине: кадр от этого не зависит
          # Первый запуск пишет и счётчики работы освещения (docs/tiles.md): сверка с эталоном ловит «стало делать
          # больше работы» без видеокарты
          for k in 1 2; do
            par same_$k 360 xvfb-run -n 9$((3 + k)) -s "-screen 0 1600x900x24" build/linux-release/anathemyre --nohud \
              --frames 4 --window 800 450 --lights --heat --cam 315 14 34 11704 -2336 --timelapse same_$k 15.5 15.5 \
              --work work_$k.txt
          done
          par_wait 2
          cmp same_1_0003.bmp same_2_0003.bmp && echo "кадры двух запусков совпали"
          cmp work_1.txt work_2.txt && echo "счётчики работы двух запусков совпали"
          tools/work_check.sh tests/work_ref.txt work_1.txt
          # потолки работы на пиксель кадра (docs/budget.md): эталон можно обновить, бюджет — только решением
          tools/budget_check.sh tests/work_budget.txt work_1.txt
          # кеш земли в обычной сцене включён и не пуст (docs/gcache.md, «Когда кеш выключен»): выключенный кеш
          # молча уводит всю землю на пиксель, а кадр при этом верный — ловим по счётчику, отдельно от допуска эталона
          awk '$1 == "gc_used" { ok = $2 > 0 } END { if (!ok) { print "кеш земли пуст: gc_used = 0"; exit 1 } }' work_1.txt
      - name: Сохранить кеш шейдеров Mesa
        if: always() && steps.mesa.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/mesa_shader_cache
          key: lvp-${{ matrix.kind }}-${{ hashFiles('data/shaders/**', 'data/materials.txt', 'tools/matgen.sh') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: matrix.kind == 'same'
        with:
          name: same
          path: |
            same_1_0003.bmp
            work_1.txt
          retention-days: 7

  # Повтор Windows — на настоящем Windows (Wine не проверяет настоящий CRT), GPU не нужен
  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
      - name: Повтор записи Linux и эталонные хеши --sim
        run: |
          # обе проверки однопоточные — рядом друг с другом
          ./anathemyre.exe --replay linux.rec > replay.log 2>&1 &
          replay=$!
          ./anathemyre.exe --sim 10000 --seed 1 --hashes win_hashes.txt > sim.log 2>&1 &
          sim=$!
          rc=0
          wait $replay && tail -n 3 replay.log || { rc=1; tail -n 40 replay.log; }
          wait $sim && tail -n 3 sim.log || { rc=1; tail -n 40 sim.log; }
          diff -u sim_hashes.txt win_hashes.txt && echo "хеши Windows совпали с эталоном" || rc=1
          exit $rc
