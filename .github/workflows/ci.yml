# CI v2 (docs/build.md): сборки обеих целей без предупреждений, запреты и слои, эталонные хеши --sim,
# повтор записи Linux на настоящем Windows; окно под lavapipe со слоями проверки Vulkan — своей работой параллельно
name: ci
on:
  push:
    branches: [claude/project-v2]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Пакеты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build glslang-tools spirv-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev mesa-vulkan-drivers vulkan-validationlayers xvfb \
            python3-numpy
      - name: Кеш компиляторов и SDL3
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/anathemyre
            build/third_party
          key: tc-${{ runner.os }}-${{ hashFiles('tools/versions.sh', 'tools/toolchain.sh', 'tools/third_party.sh') }}
      - name: Компиляторы и SDL3
        run: |
          make toolchain third_party TARGET=linux
          make toolchain third_party TARGET=windows
      - name: Одна версия clang на обеих целях
        run: |
          . tools/versions.sh
          a=$(~/.cache/anathemyre/llvm-$LLVM_VER/bin/clang --version | head -1 | grep -oE 'clang version [0-9.]+')
          b=$(~/.cache/anathemyre/llvm-mingw-$LLVM_MINGW_VER/bin/clang --version | head -1 | grep -oE 'clang version [0-9.]+')
          echo "linux: $a, windows: $b"
          [ "$a" = "$b" ]
      - name: Слои и запреты
        run: make check
      - name: Сетки в git совпадают с генератором
        run: |
          # люди: исходники MakeHuman качает tools/humanconv/fetch.sh в кеш (sha256), docs/people.md
          make -s meshes
          git diff --exit-code data/meshes data/people
      - name: Сборки
        run: |
          J=$(nproc)
          make -s -j$J WERROR=1
          make -s -j$J WERROR=1 TARGET=windows
          make -s -j$J WERROR=1 MODE=debug
          make -s -j$J WERROR=1 COMPILER=gcc
          make -s -j$J WERROR=1 NODEBUG=1
      - name: Эталонные хеши --sim (clang -O2, clang -O0 с ASan, gcc)
        run: |
          make -s sim-check
          make -s sim-check MODE=debug
          make -s sim-check COMPILER=gcc
      - name: Запись и повтор
        run: |
          build/linux-release/anathemyre --sim 10000 --seed 1 --record linux.rec
          build/linux-debug/anathemyre --replay linux.rec
      - name: Для Windows-раннера
        run: |
          mkdir -p win
          cp -r build/windows-release/anathemyre.exe build/windows-release/shaders build/windows-release/data linux.rec \
            tests/sim_hashes.txt win/
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: win/
          retention-days: 7

  # Окно — отдельно и параллельно сборкам: lavapipe рисует ландшафт ~1 с на кадр, это самый долгий шаг
  window:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Пакеты
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build glslang-tools spirv-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev mesa-vulkan-drivers vulkan-validationlayers xvfb
      - name: Кеш компиляторов и SDL3
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/anathemyre
            build/third_party
          key: tc-window-${{ runner.os }}-${{ hashFiles('tools/versions.sh', 'tools/toolchain.sh', 'tools/third_party.sh') }}
      - name: Компиляторы и SDL3
        run: |
          make toolchain third_party TARGET=linux
      - name: Сборки релиз и отладка
        run: |
          J=$(nproc)
          make -s -j$J WERROR=1
          make -s -j$J WERROR=1 MODE=debug
      - name: Окно под lavapipe, слои проверки Vulkan, кадр сцены
        env:
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/lsan.supp
        run: |
          set -o pipefail  # иначе код выхода игры теряется за tail
          . tools/versions.sh
          export ASAN_SYMBOLIZER_PATH=~/.cache/anathemyre/llvm-$LLVM_VER/bin/llvm-symbolizer  # иначе подавления не видят имён функций
          # ASan + слои проверки: ошибки Vulkan видны с первых кадров, малое окно — lavapipe считает пиксели
          xvfb-run -a -s "-screen 0 1600x900x24" build/linux-debug/anathemyre --frames 30 --validation --window 640 360 2>&1 | tail -40
          # проверка на GPU (GPU-AV, docs/graph.md «Проверки»): чтение и запись мимо буферов по адресам, кадр мира.
          # Четыре шейдера lavapipe под GPU-AV не тянет (падает, съедает ~14 ГБ или считает минуты) — без проверки.
          # Камера у стенда людей с согнутой костью и морфом: скиннинг и сферы кластеров тоже под проверкой
          xvfb-run -a -s "-screen 0 1600x900x24" build/linux-release/anathemyre --frames 4 --window 640 360 --gpuav \
            --gpuav-skip light_cells.comp,ground_bake.comp,cull_scan.comp,horizon.comp \
            --cam 45 5 6 11698 -2348.5 --stand elbow,morph1 2>&1 | tail -5
          # снимок в полный размер для глаза
          xvfb-run -a -s "-screen 0 1600x900x24" build/linux-release/anathemyre --frames 10 --validation --shot frame.bmp | tail -5
          # кадр мира одинаков от запуска к запуску (docs/frame.md, «Сверка кадров»): два запуска с тестовыми огнями
          # и картой огней по клеткам, побайтно. Без интерфейса (к/с в нём разные) и --timelapse: кадр — ровно один
          # шаг мира, а не сколько успело по часам
          # Первый запуск пишет и счётчики работы освещения (docs/tiles.md): сверка с эталоном ловит «стало делать
          # больше работы» без видеокарты
          for k in 1 2; do
            xvfb-run -a -s "-screen 0 1600x900x24" build/linux-release/anathemyre --nohud --frames 4 --window 800 450 \
              --lights --heat --cam 315 14 34 11704 -2336 --timelapse same_$k 15.5 15.5 --work work_$k.txt | tail -2
          done
          cmp same_1_0003.bmp same_2_0003.bmp && echo "кадры двух запусков совпали"
          cmp work_1.txt work_2.txt && echo "счётчики работы двух запусков совпали"
          tools/work_check.sh tests/work_ref.txt work_1.txt
          # потолки работы на пиксель кадра (docs/budget.md): эталон можно обновить, бюджет — только решением
          tools/budget_check.sh tests/work_budget.txt work_1.txt
          # кеш земли в обычной сцене включён и не пуст (docs/gcache.md, «Когда кеш выключен»): выключенный кеш
          # молча уводит всю землю на пиксель, а кадр при этом верный — ловим по счётчику, отдельно от допуска эталона
          awk '$1 == "gc_used" { ok = $2 > 0 } END { if (!ok) { print "кеш земли пуст: gc_used = 0"; exit 1 } }' work_1.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frame
          path: |
            frame.bmp
            same_1_0003.bmp
            work_1.txt
          retention-days: 7

  # Повтор Windows — на настоящем Windows (Wine не проверяет настоящий CRT), GPU не нужен
  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
      - name: Повтор записи Linux
        run: ./anathemyre.exe --replay linux.rec
      - name: Эталонные хеши --sim
        run: |
          ./anathemyre.exe --sim 10000 --seed 1 --hashes win_hashes.txt
          diff -u sim_hashes.txt win_hashes.txt && echo "хеши Windows совпали с эталоном"
