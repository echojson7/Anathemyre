name: build

# push — только основные ветки; ветки PR проверяются один раз через pull_request
on:
  push:
    branches: [stage0/test-room, main]
  pull_request:

# Новый прогон той же ветки отменяет старый
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
  LSAN_OPTIONS: suppressions=tools/lsan.supp
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

jobs:
  # Сборка один раз: релиз (gcc), отладка и vkcheck (clang, ASan/UBSan); бинарники — артефактом дальше
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-rt-18-dev libx11-dev glslang-tools spirv-tools

      - name: Слои (#include по таблице docs/code.md)
        run: ./tools/layers.sh

      - name: Релиз, gcc, без предупреждений
        run: make -j"$(nproc)" WERROR=1 CC=gcc

      - name: Игра без отладки (NODEBUG=1, docs/debug.md), gcc
        run: make -j"$(nproc)" WERROR=1 CC=gcc NODEBUG=1

      - name: Отладка с ASan/UBSan и vkcheck, clang
        run: |
          make debug -j"$(nproc)" WERROR=1 CC=clang
          make vkcheck -j"$(nproc)" WERROR=1 CC=clang

      - name: Vulkan — vk.h и SPIR-V совпадают с исходниками (vkgen, glslang, spirv-val)
        run: |
          ./tools/vkgen/gen.sh --check
          ./tools/spv/build.sh --check

      - name: Клипы — data/anims совпадают с keys.c, хеш поз как эталон (animbake, docs/animations.md)
        run: |
          make animbake -j"$(nproc)" WERROR=1 CC=gcc
          ./build/animbake check data

      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux
          path: |
            build/anathemyre
            build/anathemyre_debug
            build/vkcheck
          retention-days: 1

  # Кадры на lavapipe под ASan с validation: любой СБОЙ — провал
  render:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux
          path: build
      - name: Зависимости
        run: |
          chmod +x build/*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-6 xvfb xauth python3-pil mesa-vulkan-drivers vulkan-validationlayers

      - name: vkcheck (validation, пиксели кадра, переворот)
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./build/vkcheck --frames 60 --verify --present mailbox --shot build/vk.ppm
          python3 -c "from PIL import Image; Image.open('build/vk.ppm').save('build/vk.png')"

      - name: Кадр игры
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./build/anathemyre_debug --size 640 360 --tod 0.4 --day-stop --mute --shot build/vk_game.ppm --frames 5 | tee build/vk_game.txt
          ! grep -q "СБОЙ" build/vk_game.txt
          python3 -c "from PIL import Image; Image.open('build/vk_game.ppm').save('build/vk_game.png')"

      - name: Кадр долины
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./build/anathemyre_debug --valley --shot build/valley.ppm --frames 5 --no-pixel --tod 0.42 --day-stop | tee build/valley.txt
          ! grep -q "СБОЙ" build/valley.txt
          python3 -c "from PIL import Image; Image.open('build/valley.ppm').save('build/valley.png')"

      - name: Отряды вдали рядом (пробные отряды, бой телами)
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./build/anathemyre_debug --bands-test --warp 800 --cam 1026 249 2.0 0.3 9 --no-pixel --shot build/bands.ppm --frames 3 | tee build/bands_near.txt | grep "ОТРЯДЫ"
          ! grep -q "СБОЙ" build/bands_near.txt
          grep -q "отряд 1 рядом" build/bands_near.txt

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot
          path: |
            build/valley.png
            build/vk.png
            build/vk_game.png

  # Мир: сохранения бит в бит, отряды вдали — сумма релиза и отладки совпадает
  world:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux
          path: build
      - name: Зависимости
        run: |
          chmod +x build/*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-6 xvfb xauth mesa-vulkan-drivers vulkan-validationlayers

      - name: Сохранение (запись посреди боя, чтение в новом процессе — мир идёт бит в бит)
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./tools/save_check.sh ./build/anathemyre_debug build


      - name: Отряды вдали (сумма релиза и отладки)
        run: |
          ./build/anathemyre_debug --bench bands 4000 0.25 | tee build/bands.txt | tail -3
          test "$(./build/anathemyre --bench bands 4000 0.25 | tail -1)" = "$(tail -1 build/bands.txt)"

  # Описания и моды — отдельно от сохранений: обе проверки самые долгие под ASan
  defs:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux
          path: build
      - name: Зависимости
        run: |
          chmod +x build/*
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-6 xvfb xauth mesa-vulkan-drivers vulkan-validationlayers

      - name: Описания и моды (другой порядок описаний, правка модом, сохранение без мода, ошибка в файле)
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./tools/defs_check.sh ./build/anathemyre_debug build

  # Бой (детерминизм на 1/2/4/8 потоках) и звук, под ASan без окна
  combat:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux
          path: build
      - name: Права
        run: chmod +x build/*

      - name: Бой
        run: |
          ./build/anathemyre_debug --bench arena 100 | tail -3
          ./build/anathemyre_debug --bench battle-verify 100 100

      - name: Звук (сценка в WAV без устройства)
        run: ./build/anathemyre_debug --sound-demo build/sound.wav

      - uses: actions/upload-artifact@v4
        with:
          name: sound
          path: build/sound.wav

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - name: Кросс-сборка exe без предупреждений
        run: |
          make -j"$(nproc)" WERROR=1 TARGET_OS=windows
          make debug -j"$(nproc)" WERROR=1 TARGET_OS=windows
          make vkcheck -j"$(nproc)" WERROR=1 TARGET_OS=windows

      - name: Только системные DLL
        run: |
          x86_64-w64-mingw32-objdump -p build/anathemyre.exe | grep "DLL Name" | tee build/dlls.txt
          ! grep -viE "KERNEL32|USER32|GDI32|msvcrt" build/dlls.txt

      - name: Пакет
        run: |
          mkdir -p pkg/anathemyre/build
          cp build/anathemyre.exe pkg/anathemyre/build/
          cp -r data pkg/anathemyre/

      - uses: actions/upload-artifact@v4
        with:
          name: anathemyre-windows
          path: pkg
